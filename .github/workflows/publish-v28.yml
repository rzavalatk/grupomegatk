name: Publicar planificación comercial 18.0.38
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Publicar menu de reportes y grupos de bonificacion
        run: |
          git update-index --cacheinfo 160000,0ffff217ee95c756edcb60d76ac49aae5fae4359,commercial_planning_addons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Publica planificación comercial 18.0.38.0.0"
          git push origin master
