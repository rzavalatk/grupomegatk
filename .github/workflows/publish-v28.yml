name: Publicar planificación comercial 18.0.34
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Corregir CXC de facturas con vendedor conservando tabla
        run: |
          git update-index --cacheinfo 160000,2b86ab8fa63c99263725c119e1343d268cd8e4de,commercial_planning_addons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Publica planificación comercial 18.0.34.0.0"
          git push origin master
