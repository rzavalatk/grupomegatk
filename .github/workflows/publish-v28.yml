name: Publicar planificación comercial 18.0.41
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Publicar evaluacion mensual y cartera por vendedor
        run: |
          git update-index --cacheinfo 160000,fd8787ba7ed671c79db1cb048b07a69a1dc924cd,commercial_planning_addons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Publica planificación comercial 18.0.41.0.0"
          git push origin master
