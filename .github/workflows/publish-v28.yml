name: Publicar planificación comercial 18.0.35
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Publicar planificacion mensual de equipos
        run: |
          git update-index --cacheinfo 160000,4ecb23065d03e65aca9a4cdef2dce720f8d01260,commercial_planning_addons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Publica planificación comercial 18.0.35.0.0"
          git push origin master
