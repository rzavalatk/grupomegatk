name: Publicar planificación comercial 18.0.37
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Publicar participantes y semaforo de marcas
        run: |
          git update-index --cacheinfo 160000,38dad9cc14dde55faf64444823757e2b21efd0e2,commercial_planning_addons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Publica planificación comercial 18.0.37.0.0"
          git push origin master
