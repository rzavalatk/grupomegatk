name: Publicar planificación comercial 18.0.33
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Actualizar resumen acumulado por equipos y zonas
        run: |
          git update-index --cacheinfo 160000,2f6230d26338d292f0a61c39ec0f599f03eb2c7f,commercial_planning_addons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Publica planificación comercial 18.0.33.0.0"
          git push origin master
