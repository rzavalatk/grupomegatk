name: Publicar planificación comercial 18.0.36
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Publicar seguimiento por marca
        run: |
          git update-index --cacheinfo 160000,9b1501a00aedfb9cb8f80dfff0aad27e85df70e8,commercial_planning_addons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Publica planificación comercial 18.0.36.0.0"
          git push origin master
