name: Publicar planificación comercial 18.0.31
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Actualizar referencia del módulo probado
        run: |
          git update-index --cacheinfo 160000,46b2aa41ca1a92a61466776ba2a6b6631b0adc98,commercial_planning_addons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Publica planificación comercial 18.0.31.0.0"
          git push origin master
