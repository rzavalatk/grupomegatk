name: Publicar planificación comercial 18.0.32
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Actualizar referencia del reporte mensual y acumulado
        run: |
          git update-index --cacheinfo 160000,5223c031a9c5565048ac6a721de628f7844a3d8e,commercial_planning_addons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Publica planificación comercial 18.0.32.0.0"
          git push origin master
