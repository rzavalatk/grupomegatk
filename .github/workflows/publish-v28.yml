name: Publicar planificación comercial 18.0.39
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Publicar mejora de tipografia en marcas
        run: |
          git update-index --cacheinfo 160000,7387563bebf591ff133b5160161eb03b2d7f99bd,commercial_planning_addons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Publica planificación comercial 18.0.39.0.0"
          git push origin master
